  <header class="navigation">
    <div class="{{container}} navigation-inner">
      {{menu_button}}
      <a class="brand" href="{{root}}" aria-label="{{name}} documentation, home">
        <img class="brand-logo" src="{{assets}}img/icon-96.png" alt="" width="36" height="36" />
        <span>{{name}}</span>
      </a>
      <nav class="navigation-links" aria-label="Primary">
        <a class="navigation-link{{docs_active}}" href="{{docs_home}}"{{docs_current}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          Docs
        </a>
        <a class="navigation-link" href="{{examples}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
          Examples
        </a>
        <a class="navigation-link" href="{{repository}}">
          {{github_icon}}
          GitHub
        </a>
      </nav>
      <div class="navigation-tools">
        <button class="search-open" type="button" data-search-open aria-label="Search the documentation">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
          <span class="label">Search</span>
          <kbd data-shortcut-key>Ctrl K</kbd>

        <button id="theme-toggle" class="icon-button theme-button" type="button" aria-label="Color theme: system">
          <svg class="theme-icon theme-icon-auto" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>

    </div>
