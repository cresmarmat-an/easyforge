<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="{{root}}style.css">
<script>
try {
    var theme = localStorage.getItem("easyforge-theme");
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
} catch (error) {}
</script>
</head>
<body>
<header class="top-bar">
    <button class="menu-button" type="button" aria-label="Show the list of pages" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="{{root}}index.html">easyforge</a>
    <nav class="top-links" aria-label="Project">
        <a href="{{examples}}">Examples</a>
        <a href="{{repository}}">GitHub</a>
    </nav>
    <button class="theme-button" type="button" aria-label="Switch between light and dark">
        <svg class="icon-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <svg class="icon-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
</header>
<div class="layout">
    <nav class="sidebar" aria-label="Pages">
{{navigation}}
    </nav>
    <main class="content">
        <article>
{{body}}
        </article>
        <p class="edit-link"><a href="{{edit}}">Edit this page on GitHub</a></p>
{{pager}}
    </main>
    <aside class="outline">
{{outline}}
    </aside>
</div>
<footer class="site-footer">
    <p>easyforge is released under the MIT License. Copyright (c) 2026 Cresmar Mat-an.</p>
</footer>
<script src="{{root}}script.js"></script>
</body>
</html>
