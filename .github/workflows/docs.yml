name: Documentation

# Rebuilds the site from docs/ and publishes it with GitHub Pages whenever the
# documentation changes on main.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/site/**"
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "CMakeLists.txt"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the site
        run: python .github/site/build.py --output _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
