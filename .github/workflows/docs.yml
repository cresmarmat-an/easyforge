name: Documentation

# Builds the documentation site from the repository and publishes it with
# GitHub Pages on every push to main, so a change anywhere in the repository
# (a page, the changelog, the version, the logo) is online a minute or two
# later. It also runs once a day, which brings in changes to the examples
# repository's README, and can be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/site/requirements.txt
      - run: pip install -r .github/site/requirements.txt
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        run: python .github/site/build.py --output _site --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
