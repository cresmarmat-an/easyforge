name: Build

on:
  push:
  pull_request:

jobs:
  everything:
    name: Every library (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

  alone:
    # Each library built with only the libraries it depends on, which is how
    # someone using just that library gets it.
    name: ${{ matrix.library }} alone
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        library: [core]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -D EASYFORGE_ONLY=${{ matrix.library }}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
